[project]
name = "nojo-mcp"
version = "0.1.0"
description = "Nojo remote MCP server: OAuth resource server over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
# Virtual project: uv manages dependencies but never builds or installs this
# project as a wheel. The app is served by uvicorn from the flat src/ layout
# (src.app:app), which keeps src/.env out of any artifact.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
